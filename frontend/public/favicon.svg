<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171022"/>
      <stop offset="55%" stop-color="#0B0810"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#8E6FD6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#8E6FD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#BDA8ED"/>
      <stop offset="45%" stop-color="#8E6FD6"/>
      <stop offset="100%" stop-color="#5A3F9E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
