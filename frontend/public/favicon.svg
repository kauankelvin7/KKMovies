    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="squircle">
      <path d="M512 0C749.3 0 916.7 0 984.3 67.7C1024 134.1 1024 261.2 1024 512C1024 762.8 1024 889.9 984.3 956.3C916.7 1024 749.3 1024 512 1024C274.7 1024 107.3 1024 39.7 956.3C0 889.9 0 762.8 0 512C0 261.2 0 134.1 39.7 67.7C107.3 0 274.7 0 512 0Z"/>
    </clipPath>
