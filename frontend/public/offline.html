<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7B2FFF" />
  <title>KKMovies — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0A0A10;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .offline-container { max-width: 420px; }
    .offline-icon {
      font-size: 64px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #7B2FFF, #BF5AF2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    p {
      color: #A0A0B0;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #7B2FFF, #BF5AF2);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .btn-retry:hover {
      box-shadow: 0 0 24px rgba(123, 47, 255, 0.4);
      transform: scale(1.03);
    }
    .btn-retry:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>Você está offline</h1>
    <p>Parece que sua conexão caiu. Verifique sua internet e tente novamente.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      🔄 Tentar novamente
    </button>
  </div>
</body>
</html>
